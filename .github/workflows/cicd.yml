name: CI/CD Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Ruff (Linter)
      run: |
        ruff check .

    - name: Run Pytest
      run: |
        python -m pytest

  deploy:
      name: Deploy Release Artifact
      needs: test
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Upload Artifacts to GitHub
          uses: actions/upload-artifact@v4
          with:
            name: python-hse-solutions
            path: |
              task_128_longest_consecutive_sequence/
              task_500_keyboard_row/
              task_551_student_attendance_record/
              tests/
              requirements.txt
              README.md
